services:
  - type: web
    name: legal-doc-platform
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: legal-doc-db
          property: connectionString
      - key: APP_BASE_URL
        value: https://legal-doc-platform-pzjv.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: STAFF_EMAIL
        sync: false
      - key: STAFF_INITIAL_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: STATEMENT_ENCRYPTION_KEY
        sync: false

databases:
  - name: legal-doc-db
    region: oregon
    plan: basic-1gb
    postgresMajorVersion: "16"
    diskSizeGB: 10
    databaseName: legal_doc_db_wj1j
    user: legal_doc_db_wj1j_user
    ipAllowList: []
