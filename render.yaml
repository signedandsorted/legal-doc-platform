services:
  - type: web
    name: legal-doc-platform
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: legal-doc-db
          property: connectionString

databases:
  - name: legal-doc-db
    region: oregon
    plan: basic-1gb
    postgresMajorVersion: "16"
    diskSizeGB: 10
    databaseName: legal_doc_db_wj1j
    user: legal_doc_db_wj1j_user
    ipAllowList: []
