name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches PYTHON_VERSION in render.yaml
          python-version: "3.12.7"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Same as the Render build: drop the GUI OpenCV that rapidocr pulls in
          # and keep the headless build.
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps opencv-python-headless==4.11.0.86
          # Test-only: drives the runner's preinstalled Google Chrome for the 375 px
          # layout check in tests/test_ui_stepper.py (not needed on Render).
          pip install playwright

      - name: Run tests
        run: python -m pytest -q
