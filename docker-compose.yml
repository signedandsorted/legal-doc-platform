version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: legaldb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama:latest
    command: serve
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - db
      - ollama
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./media:/app/media

volumes:
  db_data:
  ollama_models: